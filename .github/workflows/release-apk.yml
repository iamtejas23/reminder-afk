name: Release APK

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Semver bump before building
        type: choice
        default: patch
        options:
          - patch
          - minor
          - major

permissions:
  contents: write

concurrency:
  group: release-apk
  cancel-in-progress: false

env:
  NODE_ENV: production

jobs:
  release:
    name: Build and publish APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      - name: Bump version
        id: bump
        run: |
          VERSION="$(node scripts/bump-version.mjs "${{ inputs.bump }}")"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Generate native Android project
        run: npm run android:prebuild

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Configure release signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          node scripts/prepare-android-keystore.mjs
          node scripts/patch-android-release-signing.mjs

      - name: Build release APK (arm64, optimized)
        run: npm run android:release:apk

      - name: Package APK artifact
        env:
          VERSION: ${{ steps.bump.outputs.version }}
        run: |
          APK_PATH="android/app/build/outputs/apk/release/app-release.apk"
          OUT_PATH="dist/reminder-afk-v${VERSION}.apk"
          mkdir -p dist
          cp "${APK_PATH}" "${OUT_PATH}"
          ls -lh "${OUT_PATH}"
          sha256sum "${OUT_PATH}" | tee "dist/reminder-afk-v${VERSION}.apk.sha256"

      - name: Commit version bump
        env:
          VERSION: ${{ steps.bump.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json app.json
          git diff --staged --quiet && exit 1
          git commit -m "chore(release): v${VERSION}"
          git push origin HEAD:"${GITHUB_REF_NAME}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.bump.outputs.version }}
          name: reminder-afk v${{ steps.bump.outputs.version }}
          generate_release_notes: true
          files: |
            dist/reminder-afk-v${{ steps.bump.outputs.version }}.apk
            dist/reminder-afk-v${{ steps.bump.outputs.version }}.apk.sha256
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
